<!DOCTYPE html>
<html lang="eng">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=EG+Garamond:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <title> Korok Timer </title>
</head>

<body>
    <div class="app-container">
        <img src="/img/sword_icon.png" class="sword-icon" />
        <p class="timer" id="timer"> 25:00</p>
        <div id="app-message">press start to begin</div>
        <div class="app-line">
            <div class="line-shape">
                <div class="controls">
                    <div class="button">
                        <button id="start">start</button>
                        <button button id = "stop" class ="hidden">stop </button>
                        <button id="restart">restart</button>
                    </div>
                    <div class="dots">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="./app.js"></script>
